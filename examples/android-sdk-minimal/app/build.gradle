plugins {
    // Standalone example (no shared root build file): pin AGP here,
    // mirroring sdks/android/build.gradle.
    id 'com.android.application' version '9.4.1'
}

android {
    namespace 'com.open4id.example.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.open4id.example.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.open4id:open4id-sdk:0.5.0'
    // Play Billing is compileOnly in the SDK: the host owns the store client.
    // This example mirrors the sample: buy through Play, forward the token.
    implementation 'com.android.billingclient:billing:9.1.0'
}
