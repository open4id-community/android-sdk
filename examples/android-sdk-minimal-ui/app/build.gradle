plugins {
    // Standalone example (no shared root build file): pin AGP here,
    // mirroring sdks/android/build.gradle.
    id 'com.android.application' version '9.4.1'
}

android {
    namespace 'com.open4id.example.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.open4id.example.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Published SDK (Maven Central). No project() dependency: this
    // example consumes exactly what game developers consume.
    implementation 'com.open4id:open4id-sdk:0.3.2'
}
